<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Senior Citizen Assistance Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<section id="login" class="hide">
 <main style="max-width:480px">
  <h2 style="text-align:center;margin-top:40px">Senior Citizen<br>Assistance Platform</h2>
  <div class="card">
   <label for="em">Email</label><input id="em" type="email" value="william@example.com">
   <label for="pw">Password</label><input id="pw" type="password" value="password">
   <p style="margin-top:18px"><button class="btn" style="width:100%" onclick="doLogin()">Log In</button></p>
   <p class="muted" style="text-align:center">Demo only: any email and password works.</p>
  </div>
 </main>
</section>

<!-- APP -->
<section id="app" class="hide">
 <header><h1>🏠 Senior Citizen Assistance</h1><button class="me" id="hello" onclick="go('Profile')" aria-label="Open my profile"></button><button class="btn l" style="color:#fff;border-color:#fff" onclick="logout()">Log Out</button></header>
 <nav id="nav"></nav>
 <main id="view"></main>
</section>

<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script src="script.js"></script>
</body>
</html>
