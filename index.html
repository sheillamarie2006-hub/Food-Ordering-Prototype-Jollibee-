<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Senior Citizen Assistance Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<section id="login" class="hide">
 <main style="max-width:480px">
  <h2 style="text-align:center;margin-top:40px">Senior Citizen<br>Assistance Platform</h2>
  <div class="card">
   <label for="em">Email</label><input id="em" type="email" value="william@example.com">
   <label for="pw">Password</label><input id="pw" type="password" value="password">
   <p style="margin-top:18px"><button class="btn" style="width:100%" onclick="doLogin()">Log In</button></p>
   <p class="muted" style="text-align:center">Demo only: any email and password works.</p>
  </div>
 </main>
</section>

<!-- APP -->
<section id="app" class="hide">
 <div class="topbar">
  <button class="ic" onclick="toggleMenu('side')" aria-label="Open main menu">☰</button>
  <input id="q" class="search" type="search" list="svc" placeholder="Search for services..." aria-label="Search for services" onkeydown="if(event.key==='Enter')doSearch()">
  <datalist id="svc"><option value="Telemedicine"><option value="Grocery Delivery"><option value="Caregiver Help"><option value="Social Activities"><option value="My Schedule"><option value="Profile"></datalist>
  <button class="ic" onclick="go('Grocery Delivery')" aria-label="Cart">🛒<span class="badge" id="cartN"></span></button>
  <button class="ic" onclick="toggleMenu('notif')" aria-label="Notifications">🔔<span class="badge" id="notN"></span></button>
  <button class="ic prof" id="hello" onclick="go('Profile')" aria-label="Open my profile"></button>
  <button class="ic" onclick="toggleMenu('acct')" aria-label="Account menu">≡</button>
  <div class="drop" id="drop"></div>
 </div>
 <header><h1>🏠 Senior Citizen Assistance</h1><span id="hi"></span></header>
 <nav id="nav"></nav>
 <main id="view"></main>
</section>

<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script src="script.js"></script>
</body>
</html>
